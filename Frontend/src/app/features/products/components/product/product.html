<mat-card 
    class="product-card"
    (click)="open()">
    <mat-card-header>
        <mat-card-title>{{product().name}}</mat-card-title>
            <mat-card-subtitle>{{product().barCode}} </mat-card-subtitle>
                <img mat-card-avatar [src]="product().imageUrl" [alt]="product().name"/>
    </mat-card-header>
        <mat-card-content>
            <p>{{product().category}}</p>
        </mat-card-content>
</mat-card>
